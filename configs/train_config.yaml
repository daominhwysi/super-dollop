# ==============================================================================
# VIETNAMESE SEQUENCE LABELLING v2 - TRAINING CONFIGURATION
# ==============================================================================
# Fine-tuning configuration for aisingapore/SEA-LION-ModernBERT-300M (300M params, 8192 context)
# Full parameter fine-tuning (no LoRA) with Multi-Scale Sliding Windows & Focal Loss.
# ==============================================================================

version: "2.0"

# ------------------------------------------------------------------------------
# 1. Base Model & Architecture
# ------------------------------------------------------------------------------
model:
  name_or_path: "aisingapore/SEA-LION-ModernBERT-300M"
  tokenizer_name: "aisingapore/SEA-LION-ModernBERT-300M"
  max_sequence_length: 8192
  use_lora: false                        # Full fine-tuning of all parameters (no LoRA)
  latex_placeholder: "[LATEX]"
  mask_latex_during_inference: true

# ------------------------------------------------------------------------------
# 2. Classification Head & Loss Function
# ------------------------------------------------------------------------------
loss:
  type: "focal"
  focal_gamma: 2.0                    # Calibrated from 1.0 -> 2.0 based on 5.27M dataset study
  focal_alpha: "smoothed_inverse_freq" # Smoothing power = 0.25
  label_smoothing: 0.05

model_head:
  layer_pooling: "sigmoid"            # Replaces softmax
  num_pooling_layers: 4
  use_conv_refinement: true           # 1D Depthwise Conv (kernel size = 7)
  conv_kernel_size: 7
  dropout_rates: [0.05, 0.10, 0.15, 0.20, 0.25] # Tightened MSD
  per_branch_focal_loss: true         # Fix ensemble smoothing

# Backward compatibility alias
head:
  type: "enhanced"                       # "enhanced" (SigmoidWeightedLayerPooling + Conv1D + Tightened MSD)
  layers_to_pool: 4
  layer_pooling: "sigmoid"
  use_conv_refinement: true
  conv_kernel_size: 7
  multi_sample_dropout: true
  dropout_rates: [0.05, 0.10, 0.15, 0.20, 0.25]
  dropout_prob: 0.10
  dropout_samples: 5
  focal_gamma: 2.0                       # Calibrated parameter
  label_smoothing: 0.05
  per_branch_focal_loss: true

# ------------------------------------------------------------------------------
# 3. Dataset & Sliding Window Contexts
# ------------------------------------------------------------------------------
dataset:
  data_dir: "data/training_dataset"
  spans_file: "data/training_dataset/train_spans.jsonl"
  bio_chunks_file: "data/training_dataset/train_bio_chunks.jsonl"
  val_bio_chunks_file: "data/training_dataset/test_bio_chunks.jsonl"
  gold_set: "data/benchmark_gold_set.json"
  val_ratio: 0.0                        # 0.0: No internal train split; 100% of chunks used for training
  test_ratio: 0.0                       # Test set evaluated via val_bio_chunks_file (the 63 Gold Docs)
  seed: 42

  # Multi-scale sliding window configurations (512 to 2048 tokens)
  sliding_windows:
    - [512, 128]
    - [768, 192]
    - [1024, 256]
    - [2048, 512]

# ------------------------------------------------------------------------------
# 4. Optimization & Hyperparameters (Calibrated for mmBERT Full Fine-Tuning)
# ------------------------------------------------------------------------------
training:
  output_dir: "results/mmbert_seqlabel_v2"
  learning_rate: 1.5e-5                  # Conservative backbone LR to prevent catastrophic forgetting
  head_learning_rate: 5.0e-5             # Fast classifier head learning rate
  weight_decay: 0.05                     # Stronger regularization to prevent boundary overfitting
  per_device_train_batch_size: 4         # Batch size per GPU/device
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4         # Effective batch size = 16
  num_train_epochs: 4
  lr_scheduler_type: "cosine"            # Cosine annealing with warmup
  warmup_ratio: 0.10                     # 10% warmup steps
  max_grad_norm: 1.0                     # Gradient clipping threshold

  # Precision & Accelerator Settings
  bf16: false                            # bfloat16 mixed precision (only on Ampere+ e.g. A100/H100)
  fp16: true                             # Enable fp16 mixed precision with GradScaler (recommended for NVIDIA T4/V100)
  dataloader_num_workers: 2              # 2 workers per GPU prevents memory fragmentation in DDP
  dataloader_pin_memory: true

  # Checkpointing & Validation
  eval_strategy: "steps"
  eval_steps: 1000                        # Evaluate every 250 optimization steps
  save_strategy: "steps"
  save_steps: 1000                       # Save rolling mid-epoch checkpoint every 1000 optimization steps (~1.2 hours)
  save_total_limit: 1                    # Keep 1 rolling checkpoint to prevent disk exhaustion on Kaggle/Colab (20GB quota)
  load_best_model_at_end: true
  metric_for_best_model: "eval_macro_f1"
  greater_is_better: true
  early_stopping_patience: 3             # Stop training after 3 evals without improvement

# ------------------------------------------------------------------------------
# 5. Logging & Tracking
# ------------------------------------------------------------------------------
logging:
  report_to: "none"                      # "none", "wandb", or "tensorboard"
  wandb_project: "vietnamese-sequence-labelling-v2"
  logging_steps: 15
  mlflow_experiment_name: "vietnamese-sequence-labelling"
  # Override the tracking store with MLFLOW_TRACKING_URI when needed.
